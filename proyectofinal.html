<style>
    :root {
        --color-primario: #F4F482;
        --color-secundario: #9FCC2E;
        --color-terceario: #EAEAEA;
        --color-cuartorio: #814f23;
        --color-quinto: #3A445D;
    }
    * {
        box-sizing: border-box;
    }
    body {
        background-color: var(--color-primario);
        font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        margin: 0;
    }
    header {
        padding: 15px;
        display: flex;
        justify-content: flex-end;
        align-items: center;
        background-color: var(--color-secundario);
    }
    header #form {
        display: flex;
        align-items: center;
        gap: 15px; 
    }
    .search {
        background-color: var(--color-primario);
        border: 2px solid var(--color-terceario);
        border-radius: 50px;
        font-size: 15px;
        padding: 8px 15px;
        color: var(--color-terceario);
    }
    .search::placeholder {
        color: var(--color-terceario)
    }
    .search:focus {
        outline: none;
        background-color: var(--color-quinto);
    }
    main {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
    }
    .personaje {
        width: 400px;
        margin: 15px;
        background-color: var(--color-secundario);
        box-shadow: 10px 15px 1px var(--color-cuartorio);
        position: relative;
        overflow: hidden;
        border-radius: 5px;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        align-items: center;
    }
    .personaje img {
        width: 80%;
        height: 400px;
        object-fit: contain;
        padding: 15px;
    }
    .personaje-info {
        color: var(--color-terceario);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 15px;
        padding: 15px;
        letter-spacing: 2px; 
        width: 100%; 
    }
    .personaje-info h3 {
        margin: 0;
        color: var(--color-terceario);
        flex-grow: 1; 
        text-align: right; 
    }
    .personaje-info h1 {
        margin: 0;
        color: var(--color-primario);
        font-size: 1.5em; 
    }
    .descripcion {
        background-color: var(--color-quinto);
        padding: 15px;
        position: absolute;
        left: 0;
        bottom: 0;
        right: 0;
        max-height: 100%;
        transform: translateY(101%);
        overflow-y: auto;
        transition: transform 0.3s ease-in;
        color: var(--color-terceario); 
    }
    .descripcion p {
        margin-bottom: 5px;
    }
    .descripcion strong {
        color: var(--color-secundario); 
    }
    .personaje:hover .descripcion {
        transform: translateY(0);
    }
</style>

<header>
    <form id="form">
        <img src="logo1.png" alt="logo" style="width: 100px;">
        <input type="text" id="search" class="search" placeholder="Buscar personaje">
    </form>
</header>
<main id="main"></main> 

<script>
    const API_RICK = 'https://rickandmortyapi.com/api/character';
    const API_HP = 'https://hp-api.onrender.com/api/characters';
    const main = document.getElementById('main');
    const form = document.getElementById('form');
    const search = document.getElementById('search');

    let allCharacters = [];

    async function getCharacters() {
        try {
            const [resRick, resHP] = await Promise.all([
                fetch(API_RICK),
                fetch(API_HP)
            ]);

            const dataRick = await resRick.json();
            const dataHP = await resHP.json();
            const rickCharacters = dataRick.results.map(char => ({
                id: char.id,
                name: char.name,
                status: char.status,
                species: char.species,
                image: char.image,
                origin: char.origin.name
            }));

            const hpCharacters = dataHP.map(char => ({
            
                id: char.id || Math.random().toString(36).substring(2, 9), 
                name: char.name,
                species: char.species,
                image: char.image,
                house: char.house, 
                actor: char.actor 
            })).filter(char => char.image); 

            allCharacters = [...rickCharacters, ...hpCharacters];
            showCharacters(allCharacters);
        } catch (error) {
            console.error('Error al obtener los personajes:', error);
            main.innerHTML = '<p style="color: red; text-align: center; width: 100%;">No se pudieron cargar los personajes. Intenta de nuevo más tarde.</p>';
        }
    }

    function showCharacters(characters) {
        main.innerHTML = ''; 

        if (characters.length === 0) {
            main.innerHTML = '<p style="text-align: center; width: 100%;">No se encontraron personajes.</p>';
            return;
        }

        characters.forEach((char) => {
    
            const { id, name, status, species, image, house, actor, origin } = char;
            
            const charElement = document.createElement('div');
            charElement.classList.add('personaje');

            charElement.innerHTML = `
                <img src="${image || 'https://via.placeholder.com/250x250?text=No+Image'}" alt="${name || 'Personaje sin nombre'}">
                <div class="personaje-info">
                    <h1>${id}</h1>
                    <h3>${name || 'Nombre Desconocido'}</h3>
                </div>
                <div class="descripcion">
                    <p><strong>Nombre:</strong> ${name || 'Desconocido'}</p>
                    <p><strong>Raza/Especie:</strong> ${species || 'Desconocida'}</p>
                    ${status ? `<p><strong>Status:</strong> ${status}</p>` : ''}
                    ${house ? `<p><strong>Casa:</strong> ${house}</p>` : ''}
                    ${actor ? `<p><strong>Actor:</strong> ${actor}</p>` : ''}
                    ${origin ? `<p><strong>Origen:</strong> ${origin}</p>` : ''}
                </div>
            `;
            main.appendChild(charElement);
        });
    }

    form.addEventListener('submit', (e) => {
        e.preventDefault(); 
        const searchTerm = search.value.toLowerCase().trim(); 

        if (searchTerm) {
            const filtered = allCharacters.filter(char =>
                char.name.toLowerCase().includes(searchTerm)
            );
            showCharacters(filtered);
        } else {
            showCharacters(allCharacters);
        }
    });

    getCharacters();
</script>
